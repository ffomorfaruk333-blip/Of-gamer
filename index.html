<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SocialBook</title>
<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f5f5;
}
.header{
background:linear-gradient(90deg,#7b2cff,#2196f3);
color:white;
padding:20px;
text-align:center;
}
.container{
padding:20px;
}
.card{
background:white;
padding:15px;
border-radius:10px;
margin-bottom:15px;
box-shadow:0 2px 5px rgba(0,0,0,0.1);
}
.btn{
background:#2196f3;
color:white;
padding:10px 20px;
border:none;
border-radius:5px;
}
</style>
</head>
<body>

<div class="header">
<h1>SocialBook</h1>
<p>Connect With Friends</p>
</div>

<div class="container">
<div class="card">
<h3>Welcome to SocialBook</h3>
<p>Create posts, share photos and connect with friends.</p>
<button class="btn">Get Started</button>
</div>

<div class="card">
<h3>Latest Post</h3>
<p>Hello SocialBook Users! 🎉</p>
</div>
</div>

</body>
</html>
