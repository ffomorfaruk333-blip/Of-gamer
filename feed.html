<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SocialBook Pro</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f3f5f9;
padding-bottom:80px;
}

.header{
background:linear-gradient(135deg,#7b2cff,#2196f3);
color:white;
padding:20px;
text-align:center;
border-bottom-left-radius:20px;
border-bottom-right-radius:20px;
}

.header h1{
font-size:28px;
}

.header p{
margin-top:5px;
font-size:14px;
}

.container{
max-width:700px;
margin:auto;
padding:15px;
}

.post-box{
background:white;
padding:15px;
border-radius:15px;
box-shadow:0 2px 10px rgba(0,0,0,.08);
margin-bottom:20px;
}

textarea{
width:100%;
height:90px;
padding:10px;
border:1px solid #ddd;
border-radius:10px;
resize:none;
}

.post-btn{
margin-top:10px;
padding:12px 20px;
border:none;
background:#2196f3;
color:white;
border-radius:10px;
cursor:pointer;
font-weight:bold;
}

.post{
background:white;
padding:15px;
border-radius:15px;
box-shadow:0 2px 10px rgba(0,0,0,.08);
margin-bottom:15px;
}

.user{
font-weight:bold;
font-size:18px;
margin-bottom:10px;
}

.like-btn{
margin-top:10px;
padding:8px 15px;
border:none;
background:#7b2cff;
color:white;
border-radius:8px;
cursor:pointer;
}

.bottom-nav{
position:fixed;
bottom:0;
left:0;
width:100%;
background:white;
display:flex;
justify-content:space-around;
padding:12px;
box-shadow:0 -2px 10px rgba(0,0,0,.1);
}

.bottom-nav a{
text-decoration:none;
font-size:24px;
}
</style>
</head>

<body>

<div class="header">
<h1>SocialBook</h1>
<p>Connect • Share • Grow</p>
</div>

<div class="container">

<div class="post-box">
<h3>Create Post</h3>
<br>
<textarea id="postInput" placeholder="What's on your mind?"></textarea>
<br>
<button class="post-btn" onclick="addPost()">Post</button>
</div>

<div id="posts">

<div class="post">
<div class="user">Omor Faruk</div>
<p>🚀 Welcome to SocialBook Pro!</p>

<button class="like-btn" onclick="likePost(this)">
❤️ Like <span>0</span>
</button>
</div>

</div>

</div>

<div class="bottom-nav">
<a href="feed.html">🏠</a>
<a href="reels.html">🎥</a>
<a href="#">🔔</a>
<a href="profile.html">👤</a>
</div>

<script>
function addPost(){

let text=document.getElementById("postInput").value;

if(text.trim()==""){
alert("Write something first!");
return;
}

let post=document.createElement("div");
post.className="post";

post.innerHTML=`
<div class="user">You</div>
<p>${text}</p>

<button class="like-btn" onclick="likePost(this)">
❤️ Like <span>0</span>
</button>
`;

document.getElementById("posts").prepend(post);
document.getElementById("postInput").value="";
}

function likePost(btn){
let count=btn.querySelector("span");
count.innerText=parseInt(count.innerText)+1;
}
</script>

</body>
</html>
