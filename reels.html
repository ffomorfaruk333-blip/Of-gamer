<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SocialBook Reels</title>

<style>
body{
margin:0;
background:black;
font-family:Arial,sans-serif;
}

.reel{
height:100vh;
position:relative;
scroll-snap-align:start;
}

video{
width:100%;
height:100%;
object-fit:cover;
}

.info{
position:absolute;
bottom:80px;
left:15px;
color:white;
}

.actions{
position:absolute;
right:15px;
bottom:100px;
color:white;
text-align:center;
font-size:24px;
}

.actions div{
margin:20px 0;
}

.container{
height:100vh;
overflow-y:scroll;
scroll-snap-type:y mandatory;
}
</style>
</head>
<body>

<div class="container">

<div class="reel">
<video controls autoplay loop muted>
<source src="video1.mp4" type="video/mp4">
</video>

<div class="info">
<h3>@socialbook</h3>
<p>Welcome to SocialBook Reels 🚀</p>
</div>

<div class="actions">
<div>❤️</div>
<div>💬</div>
<div>🔗</div>
</div>
</div>

<div class="reel">
<video controls loop muted>
<source src="video2.mp4" type="video/mp4">
</video>

<div class="info">
<h3>@omorfaruk</h3>
<p>My second reel 🎥</p>
</div>

<div class="actions">
<div>❤️</div>
<div>💬</div>
<div>🔗</div>
</div>
</div>

</div>

</body>
</html>
